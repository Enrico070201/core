# Konfiguration für Sportwetten-Vorhersage System

# Datensammlung
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  num_matches: 1000
  update_interval: 86400  # Sekunden (1 Tag)

# Feature Engineering
features:
  form_window: 5  # Anzahl vergangener Spiele für Form-Berechnung
  h2h_window: 5   # Anzahl vergangener H2H-Spiele
  include_player_stats: false

# Model Training
training:
  test_size: 0.2
  cv_folds: 5
  random_state: 42

  models:
    random_forest:
      n_estimators: 200
      max_depth: 15
      min_samples_split: 10
      min_samples_leaf: 5

    xgboost:
      n_estimators: 200
      max_depth: 8
      learning_rate: 0.1

# API
api:
  host: "0.0.0.0"
  port: 5000
  debug: true
  default_model: "random_forest"

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/app.log"
